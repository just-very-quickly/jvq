# jvq for GitLab CI: a hidden job to extend.
#
#   include:
#     - remote: https://raw.githubusercontent.com/just-very-quickly/jvq/v0.4.0/ci/gitlab/jvq.yml
#
#   benchmarks:
#     extends: .jvq
#     image: golang:1.26          # whatever your benchmarks need, plus curl, git, tar and sha256sum
#     variables:
#       JVQ_COMMAND: go test -run=NONE -bench=. -benchmem ./...
#
# It runs in merge request pipelines and on the default branch, downloads
# the jvq release named by JVQ_VERSION (checking it against the release's
# SHA256SUMS), and runs `jvq run`. The table goes to the job log, the JUnit
# report to the merge request's test summary, and jvq.md and jvq.json are
# kept as artifacts. Exit codes: 0 pass, 1 regression (the job fails), 2
# error. On an Alpine image, add before_script: apk add --no-cache curl git.
# The merge request rule adds merge request pipelines beside branch
# pipelines; GitLab's workflow:rules can keep one of the two.
# https://jvq.net has the rest.

.jvq:
  variables:
    GIT_DEPTH: "0"           # jvq needs the base commit, not a shallow clone
    JVQ_VERSION: v0.4.0      # a release tag, or "latest"
    JVQ_COMMAND: ""          # the benchmark command; empty uses jvq.toml or the Go default
    JVQ_ARGS: ""             # more flags for jvq run, such as -adapter json
    JVQ_DIR: "."             # where to run, relative to the repository
    JVQ_HISTORY: "false"     # "true" keeps jvq-history.jsonl in the GitLab cache; default-branch runs add to it
    JVQ_HISTORY_FAIL_OVER: "" # with history, fail when a result has moved more than this in all, such as 10%
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -eu
      case "$(uname -m)" in
        x86_64|amd64) arch=amd64 ;;
        aarch64|arm64) arch=arm64 ;;
        *) echo "jvq: unsupported architecture $(uname -m)"; exit 2 ;;
      esac
      name="jvq_linux_${arch}.tar.gz"
      if [ "$JVQ_VERSION" = latest ]; then
        url="https://github.com/just-very-quickly/jvq/releases/latest/download"
      else
        url="https://github.com/just-very-quickly/jvq/releases/download/$JVQ_VERSION"
      fi
      bin="$(mktemp -d)"
      curl -fsSL --retry 3 -o "$bin/$name" "$url/$name"
      curl -fsSL --retry 3 -o "$bin/SHA256SUMS" "$url/SHA256SUMS"
      (cd "$bin" && grep " ${name}\$" SHA256SUMS | sha256sum -c - && tar -xzf "$name")
      export PATH="$bin:$PATH"
      jvq version
      # Only the last fallback needs the target branch by name; fetch it
      # when GitLab names no base commit, and carry on if that fails.
      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ] && [ -z "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ||
          echo "jvq: couldn't fetch the target branch; carrying on"
      fi
      out="$CI_PROJECT_DIR"
      hist=""
      if [ "$JVQ_HISTORY" = true ] && [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        hist="-history $out/jvq-history.jsonl"
      fi
      cd "$JVQ_DIR"
      set +e
      if [ -n "$JVQ_COMMAND" ]; then
        jvq run -junit "$out/jvq.xml" -markdown "$out/jvq.md" -json "$out/jvq.json" $hist $JVQ_ARGS -- "$JVQ_COMMAND"
      else
        jvq run -junit "$out/jvq.xml" -markdown "$out/jvq.md" -json "$out/jvq.json" $hist $JVQ_ARGS
      fi
      code=$?
      if [ "$JVQ_HISTORY" = true ] && [ -f "$out/jvq-history.jsonl" ]; then
        if [ -n "$JVQ_HISTORY_FAIL_OVER" ]; then
          jvq history -markdown "$out/jvq-history.md" -fail-over "$JVQ_HISTORY_FAIL_OVER" "$out/jvq-history.jsonl"
          hcode=$?
          if [ $code -eq 0 ]; then code=$hcode; fi
        else
          jvq history -markdown "$out/jvq-history.md" "$out/jvq-history.jsonl"
        fi
      fi
      exit $code
  cache:
    key: jvq-history
    paths:
      - jvq-history.jsonl
    when: always
  artifacts:
    when: always
    paths:
      - jvq.md
      - jvq.json
      - jvq-history.md
    reports:
      junit: jvq.xml
