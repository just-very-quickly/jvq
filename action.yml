name: jvq performance budget
description: Fail a pull request when it makes your benchmarks slower than their budget allows, or quarantine flaky tests so they stop blocking merges.
author: JVQ.net
branding:
  icon: clock
  color: orange

inputs:
  command:
    description: The benchmark command, such as `go test -run=NONE -bench=. -benchmem ./...`. Empty uses `command` from jvq.toml, or that default in a Go module.
    required: false
    default: ""
  base:
    description: The commit to compare against. Empty picks where head branched off the base branch, or head's parent when head is on the base branch itself (a push to main).
    required: false
    default: ""
  config:
    description: Path to jvq.toml, if it isn't in the working directory or a parent.
    required: false
    default: ""
  args:
    description: More flags for `jvq run`, such as `-rounds 12 -fail-on-inconclusive`.
    required: false
    default: ""
  working-directory:
    description: Where to run, such as a Go module in a subdirectory.
    required: false
    default: "."
  history:
    description: A file name relative to working-directory, such as jvq-history.jsonl, to keep a history of runs between workflow runs, through the Actions cache. Runs that write (see history-write) add a line; every run shows the trend in the job summary. Empty keeps no history.
    required: false
    default: ""
  history-write:
    description: Which runs add to the history. auto, the default, is push, workflow_run and workflow_dispatch runs on the default branch; true is every run (use it for scheduled runs); false is none.
    required: false
    default: auto
  history-fail-over:
    description: With history, on runs that write it, fail when a gated result has moved more than this in all, beyond its noise, such as 10%. Empty only shows the trend.
    required: false
    default: ""
  history-key:
    description: The Actions cache key prefix for the history. Empty uses one per workflow, job and runner OS, so separate jobs keep separate histories.
    required: false
    default: ""
  flaky:
    description: "Run the flaky test gate instead of the benchmark gate: the test results of this job, JUnit XML or go test -json files or folders, separated by spaces or new lines (such as go-test.json). The test history is kept in the Actions cache."
    required: false
    default: ""
  flaky-history:
    description: With flaky, the test history file, relative to working-directory (and inside the workspace, where the cache can save it).
    required: false
    default: jvq-tests.jsonl
  flaky-write:
    description: "With flaky, which runs add to the test history. auto, the default, is push, workflow_dispatch and schedule runs on the default branch (a pull request is judged against it but doesn't add to it); true is every run; false is none."
    required: false
    default: auto
  flaky-key:
    description: With flaky, the Actions cache key prefix for the test history. Empty uses one per workflow, job, matrix job and runner OS, so each matrix leg keeps its own history (a test failing on one Go version and passing on another would otherwise look flaky).
    required: false
    default: ""
  flaky-args:
    description: With flaky, more flags for `jvq flaky`, such as `-json flaky.json`.
    required: false
    default: ""
  jvq-path:
    description: A folder holding a jvq binary to use instead of downloading one (for testing this action).
    required: false
    default: ""
  version:
    description: The jvq release to use, such as v0.8.0. Empty uses the tag this action was referenced by, or the latest release when referenced by a branch.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install jvq
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_JVQ_PATH: ${{ inputs.jvq-path }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_JVQ_PATH" ]; then
          echo "$INPUT_JVQ_PATH" >> "$GITHUB_PATH"
          "$INPUT_JVQ_PATH/jvq" version
          exit 0
        fi
        ver="$INPUT_VERSION"
        if [ -z "$ver" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then ver="$ACTION_REF"; else ver=latest; fi
        fi
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error title=jvq::unsupported runner OS $RUNNER_OS"; exit 2 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error title=jvq::unsupported runner architecture $RUNNER_ARCH"; exit 2 ;;
        esac
        ext=tar.gz
        [ "$os" = windows ] && ext=zip
        name="jvq_${os}_${arch}.${ext}"
        if [ "$ver" = latest ]; then
          base_url="https://github.com/just-very-quickly/jvq/releases/latest/download"
        else
          base_url="https://github.com/just-very-quickly/jvq/releases/download/${ver}"
        fi
        dir="$RUNNER_TEMP/jvq-bin"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$name" "$base_url/$name"
        curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$base_url/SHA256SUMS"
        (
          cd "$dir"
          want=$(grep " ${name}\$" SHA256SUMS | cut -d' ' -f1)
          if command -v sha256sum > /dev/null; then got=$(sha256sum "$name" | cut -d' ' -f1); else got=$(shasum -a 256 "$name" | cut -d' ' -f1); fi
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error title=jvq::checksum mismatch for $name"
            exit 2
          fi
          if [ "$ext" = zip ]; then unzip -oq "$name"; else tar -xzf "$name"; fi
        )
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/jvq" version

    - name: Decide about the jvq history
      id: hist
      if: inputs.history != '' && inputs.flaky == ''
      shell: bash
      env:
        WRITE: ${{ inputs.history-write }}
        AUTO: ${{ (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch }}
        KEY: ${{ inputs.history-key }}
        DEFAULT_KEY: jvq-history-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}
      run: |
        case "$WRITE" in
          auto) write="$AUTO" ;;
          true|false) write="$WRITE" ;;
          *) echo "::error title=jvq::history-write must be auto, true or false"; exit 2 ;;
        esac
        echo "write=$write" >> "$GITHUB_OUTPUT"
        echo "key=${KEY:-$DEFAULT_KEY}" >> "$GITHUB_OUTPUT"

    - name: Restore the jvq history
      if: inputs.history != '' && inputs.flaky == ''
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.history }}
        key: ${{ steps.hist.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.hist.outputs.key }}-

    - name: Run jvq
      if: inputs.flaky == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_HISTORY: ${{ inputs.history }}
        HISTORY_WRITE: ${{ steps.hist.outputs.write }}
      run: |
        set -uo pipefail
        args=(run)
        if [ -n "$INPUT_HISTORY" ] && [ "$HISTORY_WRITE" = true ]; then
          args+=(-history "$INPUT_HISTORY")
        elif [ -n "$INPUT_HISTORY" ]; then
          args+=(-history -)   # this run doesn't add to the history
        fi
        [ -n "$INPUT_BASE" ] && args+=(-base "$INPUT_BASE")
        [ -n "$INPUT_CONFIG" ] && args+=(-config "$INPUT_CONFIG")
        if [ -n "$INPUT_ARGS" ]; then
          read -r -a extra <<< "$INPUT_ARGS"
          args+=("${extra[@]}")
        fi
        [ -n "$INPUT_COMMAND" ] && args+=(-- "$INPUT_COMMAND")
        jvq "${args[@]}"

    - name: Save the jvq history
      if: ${{ !cancelled() && inputs.history != '' && inputs.flaky == '' && steps.hist.outputs.write == 'true' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.history }}
        key: ${{ steps.hist.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Show the jvq history
      if: ${{ !cancelled() && inputs.history != '' && inputs.flaky == '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_HISTORY: ${{ inputs.history }}
        INPUT_FAIL_OVER: ${{ inputs.history-fail-over }}
        HISTORY_WRITE: ${{ steps.hist.outputs.write }}
      run: |
        set -uo pipefail
        if [ ! -f "$INPUT_HISTORY" ]; then
          echo "jvq: no history yet; the runs that write it start it"
          exit 0
        fi
        args=(history)
        if ! command -v jvq > /dev/null; then
          exit 0   # the install step failed and said why
        fi
        # The limit applies where the history grows, so one creep on the
        # default branch doesn't fail every pull request after it.
        [ -n "$INPUT_FAIL_OVER" ] && [ "$HISTORY_WRITE" = true ] && args+=(-fail-over "$INPUT_FAIL_OVER")
        jvq "${args[@]}" "$INPUT_HISTORY"

    - name: Decide about the test history
      id: flaky
      if: inputs.flaky != ''
      shell: bash
      env:
        WRITE: ${{ inputs.flaky-write }}
        # A scheduled run is always on the default branch, and its event
        # has no repository to compare the branch with.
        AUTO: ${{ github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch) }}
        KEY: ${{ inputs.flaky-key }}
        DEFAULT_KEY: jvq-tests-${{ github.workflow }}-${{ github.job }}-${{ strategy.job-index }}-${{ runner.os }}
        HIST: ${{ inputs.flaky-history }}
      run: |
        case "$(printf '%s' "$WRITE" | tr '[:upper:]' '[:lower:]')" in
          auto) write="$AUTO" ;;
          true) write=true ;;
          false) write=false ;;
          *) echo "::error title=jvq::flaky-write must be auto, true or false"; exit 2 ;;
        esac
        if [ -z "$HIST" ]; then echo "::error title=jvq::flaky-history can't be empty"; exit 2; fi
        echo "write=$write" >> "$GITHUB_OUTPUT"
        echo "key=${KEY:-$DEFAULT_KEY}" >> "$GITHUB_OUTPUT"

    - name: Restore the test history
      if: inputs.flaky != '' && steps.flaky.outcome == 'success'
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.flaky-history }}
        key: ${{ steps.flaky.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.flaky.outputs.key }}-

    - name: Run jvq flaky
      if: inputs.flaky != '' && steps.flaky.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_RESULTS: ${{ inputs.flaky }}
        INPUT_HISTORY: ${{ inputs.flaky-history }}
        INPUT_ARGS: ${{ inputs.flaky-args }}
        INPUT_CONFIG: ${{ inputs.config }}
        WRITE: ${{ steps.flaky.outputs.write }}
      run: |
        set -uo pipefail
        args=(flaky -history "$INPUT_HISTORY")
        [ "$WRITE" = true ] || args+=(-no-write)
        [ -n "$INPUT_CONFIG" ] && args+=(-config "$INPUT_CONFIG")
        if [ -n "$INPUT_ARGS" ]; then
          read -r -a extra <<< "$INPUT_ARGS"
          args+=("${extra[@]}")
        fi
        # The results, one path per word or line; -- so a path that starts
        # with - is still a path.
        read -r -d '' -a results <<< "$INPUT_RESULTS" || true
        jvq "${args[@]}" -- "${results[@]}"

    - name: Save the test history
      if: ${{ !cancelled() && inputs.flaky != '' && steps.flaky.outputs.write == 'true' && hashFiles(format('{0}/{1}', inputs.working-directory, inputs.flaky-history)) != '' }}
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.working-directory }}/${{ inputs.flaky-history }}
        key: ${{ steps.flaky.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
