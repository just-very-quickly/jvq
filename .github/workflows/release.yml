name: release

# Builds the jvq binaries, checks each one on the kind of machine it is for,
# and publishes them with a release.
#
# Releases go out on their own. When the test workflow passes on a push to
# main and the Version in cmd/jvq/version.go has no tag yet, this workflow
# builds the binaries from that commit, runs scripts/smoke.py on them, then
# tags the commit vX.Y.Z and publishes the release "jvq vX.Y.Z" with the
# archives and SHA256SUMS attached. Nothing goes public unless every build
# and check passes. scripts/release-plan.py has the rules, and RELEASING.md
# the whole procedure.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build again, such as v0.1.0"
        required: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release-plan.py

  # jvq is pure Go, so every binary is cross-built here without cgo.
  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build and package
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            exe=jvq; [ "$os" = windows ] && exe=jvq.exe
            pkg="pkg_${os}_${arch}"
            mkdir "$pkg"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags '-s -w' -o "$pkg/$exe" ./cmd/jvq
            file "$pkg/$exe"
            cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md "$pkg/"
            if [ "$os" = windows ]; then
              (cd "$pkg" && zip -q "../dist/jvq_${os}_${arch}.zip" *)
            else
              tar -czf "dist/jvq_${os}_${arch}.tar.gz" -C "$pkg" .
            fi
          done
          file pkg_linux_amd64/jvq | grep -q 'statically linked'
          file pkg_linux_arm64/jvq | grep -q 'ARM aarch64'
          file pkg_darwin_amd64/jvq | grep -q 'x86_64'
          file pkg_darwin_arm64/jvq | grep -q 'arm64'
          file pkg_windows_arm64/jvq.exe | grep -q 'Aarch64'
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: jvq-dist
          path: dist

  # Each binary that the runner can run is smoke-tested on its own kind of
  # machine. The Intel macOS and ARM Windows builds are checked for their
  # architecture above.
  check:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            file: jvq_linux_amd64.tar.gz
          - runner: ubuntu-24.04-arm
            file: jvq_linux_arm64.tar.gz
          - runner: macos-latest
            file: jvq_darwin_arm64.tar.gz
          - runner: windows-latest
            file: jvq_windows_amd64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: jvq-dist
          path: dist
      - name: Smoke check
        shell: bash
        run: |
          mkdir bin
          case "${{ matrix.file }}" in
            *.zip) unzip -q "dist/${{ matrix.file }}" -d bin ;;
            *) tar -xzf "dist/${{ matrix.file }}" -C bin ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then python scripts/smoke.py bin; else python3 scripts/smoke.py bin; fi

  release:
    needs: [plan, build, check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
      FILES: >-
        jvq_linux_amd64.tar.gz jvq_linux_arm64.tar.gz
        jvq_darwin_arm64.tar.gz jvq_darwin_amd64.tar.gz
        jvq_windows_amd64.zip jvq_windows_arm64.zip SHA256SUMS
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jvq-dist
          path: dist
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum jvq_* > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'NOTES'
          Ready-built jvq binaries. Each archive holds the `jvq` command with the license files and README.

          | System | File |
          |---|---|
          | Linux, x86-64 (static) | jvq_linux_amd64.tar.gz |
          | Linux, ARM64 (static) | jvq_linux_arm64.tar.gz |
          | macOS, Apple silicon | jvq_darwin_arm64.tar.gz |
          | macOS, Intel | jvq_darwin_amd64.tar.gz |
          | Windows, x86-64 | jvq_windows_amd64.zip |
          | Windows, ARM64 | jvq_windows_arm64.zip |

          SHA256SUMS lists the checksums. In GitHub Actions, use the action: `uses: just-very-quickly/jvq@<this tag>`. With Go installed: `go install github.com/just-very-quickly/jvq/cmd/jvq@latest`. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or run `xattr -d com.apple.quarantine jvq`.
          NOTES
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "jvq $TAG" --notes-file ../notes.md $FILES
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
