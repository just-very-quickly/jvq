name: benchmarks

# jvq checking jvq: on every pull request, and after each release on main
# (the release workflow runs after every push to main; this job goes on only
# when that run tagged the commit),
# the published action runs the released jvq on this repository's own
# benchmarks (the statistics and the output parser, see jvq.toml), comparing
# the change with its base. It is also the check that the action and the
# latest release work end to end.

on:
  pull_request:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  jvq:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || '' }}
      - name: Only after a release
        id: gate
        run: |
          if [ "${{ github.event_name }}" = pull_request ] || [ -n "$(git tag --points-at HEAD)" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release was made from this commit; nothing to check."
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - if: steps.gate.outputs.go == 'true'
        uses: ./
        with:
          version: latest
