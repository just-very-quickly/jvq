name: test

# Every push to main and every pull request: formatting, vet, the full test
# suite (unit tests, and the real jvq binary run on fixture git repositories:
# a slowdown caught, no change passed, an extra allocation caught, a base
# that doesn't build, a shallow clone, an interrupted and a killed run
# cleaned up) on Linux, macOS and Windows, the race detector on Linux, the
# release plan's cases, and the smoke check on a binary built the way the
# release builds it. A passing run on main starts the release workflow,
# which releases a raised version.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if ! go test -count=1 ./... 2>&1 | tee test-output.txt; then
            # Show the failures as annotations, so they can be read without
            # access to the raw log.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:' test-output.txt | head -30 | while IFS= read -r line; do
              echo "::error title=go test ${RUNNER_OS}::${line}"
            done
            exit 1
          fi
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - run: python3 -B -m unittest discover -s scripts -p '*_test.py'
        if: runner.os != 'Windows'
      - name: Smoke check on a release-style build
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -trimpath -ldflags '-s -w' -o "bin/jvq$( [ "$RUNNER_OS" = Windows ] && echo .exe )" ./cmd/jvq
          if [ "$RUNNER_OS" = Windows ]; then python scripts/smoke.py bin; else python3 scripts/smoke.py bin; fi
